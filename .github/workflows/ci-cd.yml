name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Backend (Flask) checks
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Syntax check
      run: python -m py_compile app.py config.py db.py seed_admin.py

  # Simple Node backend checks
  simple-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./simple-backend

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: simple-backend/package-lock.json

    - name: Install dependencies
      run: npm ci

  # Deploy to production (only on main branch)
  deploy:
    needs: [backend, simple-backend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v3

    - name: Deploy Backend
      run: echo "Deploy backend"
      # Add your deployment commands here

    - name: Deploy Frontend
      run: echo "Deploy frontend"
      # Add your deployment commands here
